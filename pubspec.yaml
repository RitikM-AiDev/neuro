name: neuro_apps
description: "Personal Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_overlay_window:
    path: ./plugins/flutter_overlay_window

  # Microphone audio capture
  record: ^7.2.0

  # HTTP client for Gemini API
  dio: ^5.11.1

  # Environment variables (.env)
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
