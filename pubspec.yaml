
name: neuro_apps
description: "Personal Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_overlay_window:
    path: ./plugins/flutter_overlay_window

  # Microphone audio capture
  record: ^7.2.0

  # Model downloading
  dio: ^5.11.1

  # Private model storage
  path_provider: ^2.1.6

  # Model checksum verification
  crypto: ^3.0.8
  sherpa_onnx: 2.0.2

  # Offline speech detection and recognition
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
